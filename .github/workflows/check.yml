name: Check LMS
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node check.js
        env:
          LMS_EMAIL: ${{ secrets.LMS_EMAIL }}
          LMS_PASS: ${{ secrets.LMS_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add last.txt || true
          git commit -m "update last" || true
          git push || true
