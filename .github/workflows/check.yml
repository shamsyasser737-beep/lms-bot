name: Check LMS

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node check.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LMS_URL: ${{ secrets.LMS_URL }}
          LMS_EMAIL: ${{ secrets.LMS_EMAIL }}
          LMS_PASSWORD: ${{ secrets.LMS_PASSWORD }}
      - name: Save last.txt
        run: |
          git config user.name "lms-bot"
          git config user.email "bot@lms.local"
          git add last.txt || true
          git diff --cached --quiet || git commit -m "Update last.txt"
          git push || true
